version: 2

# rosdep source dùng khi chạy `rosdep install --from-paths src`.
#
# Lưu ý: file này CHỈ liệt kê gói hệ thống/ROS. Thư viện Python cài bằng
# pip không thuộc rosdep (bản cũ liệt kê chúng trong khoá `packages`, rosdep
# sẽ báo "Cannot locate rosdep definition"). Xem Dockerfile cho phần pip.
#
# ncnn: không có gói rosdep chuẩn cho Python binding. Cài bằng pip
# (xem Dockerfile: `pip install ncnn`), hoặc tự đặt tên ở đây nếu đã tạo
# key riêng (không khuyến khích vì không portable).

packages:
  ros:
    # Core
    - rclcpp
    - rclpy
    - sensor_msgs
    - std_msgs
    - cv-bridge
    - launch
    - launch-ros
    - ament-index-python

    # Build tools
    - ament-cmake
    - ament-cmake-gtest
    - ament-lint-auto
    - ament-lint-common
    - python3-colcon-common-extensions

  apt:
    # OpenCV cho C++ (node fusion dùng cv::Mat)
    - libopencv-dev
    - python3-opencv
    - python3-numpy
    - v4l-utils
    - udev
    - usbutils
    # JSON và GUI Qt5
    - libjsoncpp-dev
    - qtbase5-dev
    # Cho serial port access
    - modemmanager